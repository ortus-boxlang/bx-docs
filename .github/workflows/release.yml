# This workflow is used to build releases
# It can also be called by other workflows to reuse the release flow.
name: Release

on:
  # If you push to main this will trigger a stable release
  push:
    branches:
      - master
      - main

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
        description: "Is this a snapshot build?"
        required: false
        default: false
        type: boolean

  # Manual Trigger
  workflow_dispatch:

env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK: 21
  BUILD_ID: ${{ github.run_number }}
  SNAPSHOT: ${{ inputs.snapshot || false }}

jobs:
  #############################################
  # Build Snapshot or Final Release
  #############################################
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.4.0

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_API_TOKEN }}

      - name: Setup Environment Variables For Build Process
        id: current_version
        run: |
          # Extract version from box.json and store it in MODULE_VERSION
          MODULE_VERSION=$(cat box.json | jq -r '.version')
          echo "MODULE_VERSION=$MODULE_VERSION" >> $GITHUB_ENV

          # Set package version dynamically according to build process
          box package set version=@build.version@+@build.number@

          # Snapshot builds are always on the development branch
          echo "Github Ref is $GITHUB_REF"
          if [ "$GITHUB_REF" == 'refs/heads/development' ]
          then
            echo "BRANCH=development" >> $GITHUB_ENV
            echo "MODULE_VERSION=${MODULE_VERSION}-snapshot" >> $GITHUB_ENV
          else
            # A real release push - to whichever of main/master this
            # workflow's own `on: push: branches:` trigger above matched -
            # passed through as the ACTUAL branch name rather than a
            # hardcoded "master", so Build.bx's own `variables.branch ==
            # "main"` check (which stamps real build metadata, `+<build
            # ID>`, onto an otherwise-bare release version - see its own
            # docblock) actually fires for a `main` push instead of
            # silently no-op'ing behind a "master" value this repo's own
            # primary branch (per this repo's docs, `main`) never matches.
            echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.MODULE_VERSION }}

      - name: Generate a docs/releases/ "what's new" page for this version
        if: env.SNAPSHOT == 'false'
        run: |
          TAG="v${{ env.MODULE_VERSION }}"
          RELEASE_DATE=$(date +%Y-%m-%d)
          mkdir -p docs/releases

          # Extract this version's own section from changelog.md - everything
          # between its "## [tag]" heading and the next "## [" heading (or EOF).
          awk -v tag="$TAG" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if (index($0, "[" tag "]") > 0) { capture = 1; next }
            }
            capture { print }
          ' changelog.md > /tmp/release-body.md

          # Trim leading/trailing blank lines left over from the heading split.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release-body.md

          # Sort newest-first in the nav: order is the version's magnitude,
          # negated, so a higher version always sorts ahead of a lower one.
          ORDER=$(echo "${{ env.MODULE_VERSION }}" | awk -F. '{ printf "%d", -(($1+0)*100000000 + ($2+0)*10000 + ($3+0)) }')

          {
            echo "---"
            echo "title: ${TAG}"
            echo "order: ${ORDER}"
            echo "---"
            echo ""
            echo "# ${TAG} - ${RELEASE_DATE}"
            echo ""
            cat /tmp/release-body.md
          } > "docs/releases/${TAG}.md"

      - name: Build it!
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          boxlang Build.bx \
            --buildId=${{ env.BUILD_ID }} \
            --version=${{ env.MODULE_VERSION }} \
            --branch=${{ env.BRANCH }}

      - name: Commit Changelog [unreleased] with latest version
        uses: EndBug/add-and-commit@v10.0.0
        if: env.SNAPSHOT == 'false'
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Finalized changelog for v${{ env.MODULE_VERSION }}"
          add: |
            changelog.md
            docs/releases/*.md

      - name: Tag Version
        uses: rickstaa/action-create-tag@v1.7.2
        if: env.SNAPSHOT == 'false'
        with:
          tag: "v${{ env.MODULE_VERSION }}"
          force_push_tag: true
          message: "Latest Release v${{ env.MODULE_VERSION }}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: boxlang-build
          path: |
            changelog.md
            docs/releases/*.md

      - name: Upload Distributions to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/artifacts"
          DEST_DIR: "ortussolutions/boxlang-modules/${{ env.MODULE_ID }}/${{ env.MODULE_VERSION }}"

      - name: Publish to ForgeBox
        run: |
          cd build/module
          box forgebox publish --force
          cd $GITHUB_WORKSPACE

      - name: Create Github Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        continue-on-error: true
        if: env.SNAPSHOT == 'false'
        id: create_release
        with:
          title: ${{ env.MODULE_VERSION }}
          changelog: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ env.MODULE_VERSION }}

      - name: Inform Slack
        if: ${{ always() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "Module ${{ env.MODULE_ID }} v${{ env.MODULE_VERSION }} Built with ${{ job.status }}!"
          SLACK_TITLE: "BoxLang Module ${{ env.MODULE_ID }}"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: github.ref != 'refs/heads/development'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      checks: write
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout Development Repository
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: boxlang-build
          path: .tmp

      - name: Copy Changelog & Release Notes
        run: |
          cp .tmp/changelog.md changelog.md
          mkdir -p docs/releases
          cp .tmp/docs/releases/*.md docs/releases/ 2>/dev/null || true

      - name: Bump Version
        run: |
          box bump --minor --!TagVersion

      - name: Commit Version Bump
        uses: EndBug/add-and-commit@v10.0.0
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Version bump"
          add: |
            box.json
            changelog.md
            docs/releases/*.md
