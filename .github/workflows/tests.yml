name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

  # Manual Trigger
  workflow_dispatch:

env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK_VERSION: 21

jobs:
  tests:
    name: Tests ${{ github.event.repository.name }}
    runs-on: ${{ matrix.os }}
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        experimental: [false]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          with-commandbox: true
          modules: bx-esapi bx-yaml bx-toml bx-markdown bx-image

      - name: Check BoxLang Version
        run: boxlang --version

      - name: Install Dev Dependencies
        run: box install --verbose --nosave

      - name: Test Module
        run: |
          # setup-boxlang points BOXLANG_HOME at ${GITHUB_WORKSPACE}/.boxlang
          # (already owned by the runner user) - that's where BoxLang actually
          # looks for modules/, not under ${HOME}.
          mkdir -p "${BOXLANG_HOME}/modules"
          ln -s "$(pwd)" "${BOXLANG_HOME}/modules/$(basename "$(pwd)")"

      - name: Run Tests
        run: |
          # Just the one run, with --reporter=ANTJunit - BoxLangRunner.bx
          # unconditionally forces its own reporter to "text" whenever
          # --stream is set (its own shouldStream branch: "Console reporter
          # writes directly to stdout, which conflicts with stream-only
          # output"), and only calls generateAntReports() when the reporter
          # is still "ANTJunit" - so streaming and real JUnit XML output are
          # mutually exclusive in a single invocation, not something a
          # workflow-side flag combination can work around. A prior version
          # of this step ran the suite twice (once streamed for live
          # progress/a real compile error that a StackOverflowError in
          # TestBox's own JSON serialization once masked from the
          # end-of-run-only report, once with --reporter=ANTJunit for the
          # JUnit XML this step's own failure check and the
          # publish-test-results job both need) - not worth doubling every
          # CI run's wall-clock time for that.
          ./testbox/run --reporter=ANTJunit --verbose
          # BoxLang's TestBox runner never sets a nonzero process exit code
          # based on spec failures - the step above "succeeds" even when
          # specs failed, the same silent-green gap that let a real
          # regression (a stale test assertion) ship unnoticed for a while.
          # Fail this step explicitly by summing every generated JUnit XML
          # file's own `failures`/`errors` attributes (ANTJUnitReporter.cfc's
          # own <testsuite> shape).
          #
          # A run that crashes before writing ANY JUnit XML at all - a
          # compile error in a spec file, TestBox's own bootstrap failing -
          # is the same silent-green gap in a different shape: the glob
          # below then matches nothing, grep finds no failures=".../
          # errors="..." attributes to sum, and the two sums both come out
          # 0 - indistinguishable from "every spec genuinely passed" by the
          # check that follows, unless this run out for it separately.
          # tests="..." (this exact suite's own spec count, same
          # <testsuite> shape) catches this: it's 0 in exactly the cases
          # failures/errors would otherwise misreport as green - no XML
          # written, or XML written with zero specs recorded in it - real
          # runs of this suite are never actually empty.
          shopt -s nullglob
          resultFiles=(tests/results/*.xml)
          if [ "${#resultFiles[@]}" -eq 0 ]; then
            echo "::error::No tests/results/*.xml were written at all - the test run likely crashed before TestBox could even start (check the ./testbox/run output above for a compile error or bootstrap failure)"
            exit 1
          fi
          totalTests=$(grep -ohE 'tests="[0-9]+"' "${resultFiles[@]}" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          if [ "${totalTests}" -eq 0 ]; then
            echo "::error::tests/results/*.xml were written but recorded 0 total specs - see tests/results/*.xml (uploaded as this job's tests-${{ matrix.os }} artifact); this suite is never genuinely empty, so treat this the same as a crashed run"
            exit 1
          fi
          failures=$(grep -ohE 'failures="[0-9]+"' "${resultFiles[@]}" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          errors=$(grep -ohE 'errors="[0-9]+"' "${resultFiles[@]}" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Tests: ${totalTests}, Failures: ${failures}, Errors: ${errors}"
          if [ "${failures}" -gt 0 ] || [ "${errors}" -gt 0 ]; then
            echo "::error::${failures} failing / ${errors} erroring spec(s) - see tests/results/*.xml (uploaded as this job's tests-${{ matrix.os }} artifact) for exactly which ones"
            exit 1
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: |
            tests/results/**

      # UNCOMMENT THE FOLLOWING LINES TO ENABLE SLACK NOTIFICATIONS
      # - name: Inform Slack
      #   if: ${{ failure() && github.ref == 'refs/heads/development' }}
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_CHANNEL: coding
      #     SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
      #     SLACK_ICON_EMOJI: ":bell:"
      #     SLACK_MESSAGE: "${{ env.MODULE_ID }} Tests FAILED!  You broke the build! :("
      #     SLACK_TITLE: "${{ env.MODULE_ID }} Build Failure"
      #     SLACK_USERNAME: CI
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            artifacts/**/*.xml
