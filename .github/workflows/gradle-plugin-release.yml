# Publishes the bx-sites Gradle plugin to the Gradle Plugin Portal.
#
# One-time setup before this can succeed (see the plan / PR description for
# the full explanation): create an account at https://plugins.gradle.org,
# generate an API key pair from your profile's "API Keys" page, then add
# them as repository secrets GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET.
# There is no separate account per plugin - one Portal account can publish
# any number of plugin IDs it has claimed.
name: Gradle Plugin Release

on:
  push:
    tags:
      - "gradle-plugin-v*"

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Strips the "gradle-plugin-v" tag prefix down to a real version
      # (e.g. "gradle-plugin-v0.1.0" -> "0.1.0") - the Portal rejects
      # "-SNAPSHOT", which is what build.gradle.kts defaults to otherwise.
      - name: Derive release version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#gradle-plugin-v}" >> "$GITHUB_OUTPUT"

      - name: Test before publishing
        working-directory: gradle-plugin
        run: ./gradlew check --stacktrace

      - name: Publish to the Gradle Plugin Portal
        working-directory: gradle-plugin
        run: ./gradlew publishPlugins -PreleaseVersion="${{ steps.version.outputs.value }}" --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
