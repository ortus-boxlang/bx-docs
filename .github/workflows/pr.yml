name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
    # The Java subprojects (core/, gradle-plugin/, maven-plugin/) have their
    # own CI (gradle-plugin-ci.yml, maven-plugin-ci.yml) and build/test with
    # entirely different tooling - keep the two decoupled.
    paths-ignore:
      - "core/**"
      - "gradle-plugin/**"
      - "maven-plugin/**"
  pull_request:
    branches:
      - "releases/v*"
      - development
    paths-ignore:
      - "core/**"
      - "gradle-plugin/**"
      - "maven-plugin/**"

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit
